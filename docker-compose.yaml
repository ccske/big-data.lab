name: big-data.lab

services:
  hadoop-master:
    build:
      context: .
      dockerfile: hadoop/Dockerfile
      args:
        HADOOP_MASTER: "hadoop-master"
        HADOOP_VERSION: ${HADOOP_VERSION}
    image: big-data.lab/hadoop
    container_name: hadoop-master
    restart: unless-stopped
    hostname: hadoop-master
    env_file:
      - path: ./.env
        required: false
    command: ["/entrypoint/entrypoint-master.sh"]
    ports:
      - 9870:9870    # HDFS NameNode UI
      - 8020:8020    # HDFS NameNode RPC
      - 8088:8088    # YARN ResourceManager UI
      - 8032:8032    # YARN ResourceManager AMI
      - 19888:19888  # MapReduce JobHistory Server UI
      - 10020:10020  # MapReduce JobHistory Server IPC
    volumes:
      - hadoop_master_data:/volumes/data
      - hadoop_master_logs:/volumes/logs
    networks: [net]

  hadoop-worker1:
    image: big-data.lab/hadoop
    container_name: hadoop-worker1
    depends_on:
      - hadoop-master
    restart: unless-stopped
    hostname: hadoop-worker1
    environment:
      AM_RPC: "43210-43219"
    command: ["/entrypoint/entrypoint-worker.sh"]
    expose:
      - 9864  # HDFS DataNode UI
      - 8042  # YARN NodeManager UI
    ports:
      - 43210-43219:43210-43219  # MapReduce AM RPC
    volumes:
      - hadoop_worker1_data:/volumes/data
      - hadoop_worker1_logs:/volumes/logs
    networks: [net]

  hadoop-worker2:
    image: big-data.lab/hadoop
    container_name: hadoop-worker2
    depends_on:
      - hadoop-master
    restart: unless-stopped
    hostname: hadoop-worker2
    environment:
      AM_RPC: "43220-43229"
    command: ["/entrypoint/entrypoint-worker.sh"]
    expose:
      - 9864  # HDFS DataNode UI
      - 8042  # YARN NodeManager UI
    ports:
      - 43220-43229:43220-43229  # MapReduce AM RPC
    volumes:
      - hadoop_worker2_data:/volumes/data
      - hadoop_worker2_logs:/volumes/logs
    networks: [net]

  hadoop-worker3:
    image: big-data.lab/hadoop
    container_name: hadoop-worker3
    depends_on:
      - hadoop-master
    restart: unless-stopped
    hostname: hadoop-worker3
    environment:
      AM_RPC: "43230-43239"
    command: ["/entrypoint/entrypoint-worker.sh"]
    expose:
      - 9864  # HDFS DataNode UI
      - 8042  # YARN NodeManager UI
    ports:
      - 43230-43239:43230-43239  # MapReduce AM RPC
    volumes:
      - hadoop_worker3_data:/volumes/data
      - hadoop_worker3_logs:/volumes/logs
    networks: [net]

  spark-history:
    build:
      context: .
      additional_contexts:
        big-data.lab/hadoop: "service:hadoop-master"
      dockerfile: spark/Dockerfile
      args:
        SPARK_VERSION: ${SPARK_VERSION}
    image: big-data.lab/spark
    container_name: spark-history
    depends_on:
      - hadoop-master
      - hadoop-worker1
      - hadoop-worker2
      - hadoop-worker3
    restart: unless-stopped
    hostname: spark-history
    command: ["/entrypoint/entrypoint-history.sh"]
    ports:
      - 18080:18080  # Spark History Server UI
    volumes:
      - spark_history_logs:/volumes/logs
    networks: [net]

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: big-data.lab/nginx
    container_name: nginx
    depends_on: 
      - hadoop-master
      - hadoop-worker1
      - hadoop-worker2
      - hadoop-worker3
    restart: unless-stopped
    hostname: nginx
    ports:
      - 9864:9864  # HDFS DataNode UI
      - 8042:8042  # YARN NodeManager UI
    networks: [net]

  mysql:
    build:
      context: .
      dockerfile: mysql/Dockerfile
    image: big-data.lab/mysql
    container_name: mysql
    restart: unless-stopped
    hostname: mysql
    environment:
      MYSQL_ROOT_PASSWORD: "root"
    ports:
      - 3306:3306
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [net]

volumes:
  hadoop_master_data:
  hadoop_master_logs:
  hadoop_worker1_data:
  hadoop_worker1_logs:
  hadoop_worker2_data:
  hadoop_worker2_logs:
  hadoop_worker3_data:
  hadoop_worker3_logs:
  spark_history_logs:
  mysql_data:

networks:
  net:
    driver: bridge
