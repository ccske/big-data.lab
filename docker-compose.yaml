name: big-data.lab

services:
  base:
    build:
      context: .
      dockerfile: base/Dockerfile
    image: big-data.lab/base
    restart: no
    command: ["true"]

  hadoop-master:
    build:
      context: .
      dockerfile: hadoop/Dockerfile
      additional_contexts:
        big-data.lab/base: "service:base"
    image: big-data.lab/hadoop
    container_name: hadoop-master
    restart: unless-stopped
    hostname: hadoop-master
    env_file:
      - path: ./.env
        required: false
    command: ["/usr/local/bin/entrypoint-master.sh"]
    ports:
      - 9870:9870    # HDFS NameNode UI
      - 8020:8020    # HDFS NameNode RPC
      - 8088:8088    # YARN ResourceManager UI
      - 8032:8032    # YARN ResourceManager AMI
      - 19888:19888  # MapReduce JobHistory Server UI
      - 10020:10020  # MapReduce JobHistory Server IPC
    volumes:
      - hadoop_master_data:/volumes/data
      - hadoop_master_logs:/volumes/logs
    networks: [net]

  hadoop-worker1:
    image: big-data.lab/hadoop
    container_name: hadoop-worker1
    depends_on:
      - hadoop-master
    restart: unless-stopped
    hostname: hadoop-worker1
    env_file:
      - path: ./.env
        required: false
    environment:
      HADOOP_MASTER: "hadoop-master"
      AM_RPC: "43210-43219"
    command: ["/usr/local/bin/entrypoint-worker.sh"]
    expose:
      - 9864  # HDFS DataNode UI
      - 8042  # YARN NodeManager UI
    ports:
      - 43210-43219:43210-43219  # MapReduce AM RPC
    volumes:
      - hadoop_worker1_data:/volumes/data
      - hadoop_worker1_logs:/volumes/logs
    networks: [net]

  hadoop-worker2:
    image: big-data.lab/hadoop
    container_name: hadoop-worker2
    depends_on:
      - hadoop-master
    restart: unless-stopped
    hostname: hadoop-worker2
    env_file:
      - path: ./.env
        required: false
    environment:
      HADOOP_MASTER: "hadoop-master"
      AM_RPC: "43220-43229"
    command: ["/usr/local/bin/entrypoint-worker.sh"]
    expose:
      - 9864  # HDFS DataNode UI
      - 8042  # YARN NodeManager UI
    ports:
      - 43220-43229:43220-43229  # MapReduce AM RPC
    volumes:
      - hadoop_worker2_data:/volumes/data
      - hadoop_worker2_logs:/volumes/logs
    networks: [net]

  hadoop-worker3:
    image: big-data.lab/hadoop
    container_name: hadoop-worker3
    depends_on:
      - hadoop-master
    restart: unless-stopped
    hostname: hadoop-worker3
    env_file:
      - path: ./.env
        required: false
    environment:
      HADOOP_MASTER: "hadoop-master"
      AM_RPC: "43230-43239"
    command: ["/usr/local/bin/entrypoint-worker.sh"]
    expose:
      - 9864  # HDFS DataNode UI
      - 8042  # YARN NodeManager UI
    ports:
      - 43230-43239:43230-43239  # MapReduce AM RPC
    volumes:
      - hadoop_worker3_data:/volumes/data
      - hadoop_worker3_logs:/volumes/logs
    networks: [net]

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: big-data.lab/nginx
    container_name: nginx
    depends_on: 
      - hadoop-master
      - hadoop-worker1
      - hadoop-worker2
      - hadoop-worker3
    restart: unless-stopped
    hostname: nginx
    ports:
      - 9864:9864  # HDFS DataNode UI
      - 8042:8042  # YARN NodeManager UI
    networks: [net]

  mysql:
    build:
      context: .
      dockerfile: mysql/Dockerfile
    image: big-data.lab/mysql
    container_name: mysql
    restart: unless-stopped
    hostname: mysql
    environment:
      MYSQL_ROOT_PASSWORD: "root"
    ports:
      - 3306:3306
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [net]

  hive-metastore:
    build:
      context: .
      dockerfile: hive/Dockerfile
      additional_contexts:
        big-data.lab/hadoop: "service:hadoop-master"
    image: big-data.lab/hive
    container_name: hive-metastore
    depends_on:
      - hadoop-master
      - mysql
    restart: unless-stopped
    hostname: hive-metastore
    environment:
      HADOOP_MASTER: "hadoop-master"
      MYSQL: "mysql"
    command: ["/usr/local/bin/entrypoint-metastore.sh"]
    ports:
      - 9083:9083  # Metastore Thrift
    networks: [net]

  hive-server2:
    image: big-data.lab/hive
    container_name: hive-server2
    depends_on:
      - hadoop-master
      - hive-metastore
    restart: unless-stopped
    hostname: hive-server2
    environment:
      HADOOP_MASTER: "hadoop-master"
      HIVE_METASTORE: "hive-metastore"
    command: ["/usr/local/bin/entrypoint-server2.sh"]
    ports:
      - 10000:10000  # HS2 Thrift
      - 10002:10002  # HS2 Web UI
    networks: [net]

  nifi:
    build:
      context: .
      dockerfile: nifi/Dockerfile
      additional_contexts:
        big-data.lab/hadoop: "service:hadoop-master"
    image: big-data.lab/nifi
    container_name: nifi
    depends_on:
      - hadoop-master
      - mysql
      - hive-metastore
      - hive-server2
    restart: unless-stopped
    hostname: nifi
    ports:
      - "8443:8443"   # NiFi Web UI (HTTPS)
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_state:/opt/nifi/nifi-current/state
    networks: [net]

volumes:
  hadoop_master_data:
  hadoop_master_logs:
  hadoop_worker1_data:
  hadoop_worker1_logs:
  hadoop_worker2_data:
  hadoop_worker2_logs:
  hadoop_worker3_data:
  hadoop_worker3_logs:
  mysql_data:
  nifi_conf:
  nifi_state:

networks:
  net:
    driver: bridge
