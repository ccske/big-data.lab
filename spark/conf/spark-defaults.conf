spark.master                       yarn
spark.submit.deployMode            client
spark.eventLog.enabled             true
spark.eventLog.dir                 hdfs:///shared/spark-logs
spark.history.fs.logDirectory      hdfs:///shared/spark-logs
spark.yarn.jars                    hdfs:///shared/spark-dist/jars/*

spark.executor.instances           1
spark.executor.cores               1
spark.executor.memory              512m
spark.executor.memoryOverhead      128m

spark.driver.cores                 1
spark.driver.memory                512m
spark.driver.memoryOverhead        128m

spark.default.parallelism          2
spark.sql.shuffle.partitions       4
spark.sql.files.maxPartitionBytes  64m

spark.serializer                   org.apache.spark.serializer.KryoSerializer
spark.kryoserializer.buffer        8m
spark.kryoserializer.buffer.max    64m
spark.shuffle.compress             true
spark.rdd.compress                 true
spark.io.compression.codec         lz4

spark.executor.extraJavaOptions    -XX:+UseG1GC -XX:+UseStringDeduplication
spark.driver.extraJavaOptions      -XX:+UseG1GC -XX:+UseStringDeduplication

spark.dynamicAllocation.enabled    false

spark.task.maxFailures             1
